name: TUI release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI
        run: bun run ci

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/VERSION = \"[^\"]*\"/VERSION = \"${version}\"/" src/cli/version.ts
          grep -F "VERSION = \"${version}\"" src/cli/version.ts

      - name: Package Linux binaries
        run: bash scripts/package-tui.sh

      - name: Install QEMU for arm64 smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt libc6-arm64-cross

      - name: Smoke test x64 binary
        run: |
          ./dist/combined-wrapper-bun-linux-x64 --version
          ./dist/combined-wrapper-bun-linux-x64 --help

      - name: Smoke test print mode (x64)
        run: |
          out="$(./dist/combined-wrapper-bun-linux-x64 --print --plan examples/plans/download-transcode.json)"
          if [ -z "$(printf '%s' "$out" | tr -d '[:space:]')" ]; then
            echo "print mode produced no output" >&2
            exit 1
          fi
          printf '%s\n' "$out"

      - name: Smoke test arm64 binary
        run: QEMU_LD_PREFIX=/usr/aarch64-linux-gnu qemu-aarch64 ./dist/combined-wrapper-bun-linux-arm64 --version

      - name: Write checksums
        run: |
          cd dist
          sha256sum combined-wrapper-bun-linux-x64 combined-wrapper-bun-linux-arm64 > combined-wrapper-checksums.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/combined-wrapper-bun-linux-x64
            dist/combined-wrapper-bun-linux-arm64
            dist/combined-wrapper-checksums.txt
