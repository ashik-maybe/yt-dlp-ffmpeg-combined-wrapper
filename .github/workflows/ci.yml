name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Package TUI
        run: bash scripts/package-tui.sh
      - name: Smoke test x64 binary
        run: |
          bin="$(find dist -maxdepth 1 -type f -name '*linux-x64' -print -quit)"
          if [ -z "$bin" ]; then
            echo "no x64 binary found in dist" >&2
            exit 1
          fi
          "$bin" --version
          "$bin" --help
